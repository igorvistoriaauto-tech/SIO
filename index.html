<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIO - Sistema de Orçamentos e Checklist</title>
    <!-- Configurações essenciais para PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <!-- Insira aqui a estrutura do seu sistema SIO (botões, inputs e scripts) -->
    <div id="app">
        <h1>SIO - Sistema Inteligente de Orçamento</h1>
        <p>Seu sistema está pronto e configurado para PWA e atualizações via GitHub.</p>
    </div>

    <!-- Script de registro do Service Worker para atualizações automáticas -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registrado com sucesso!', reg.scope))
                    .catch((err) => console.log('Falha ao registrar o Service Worker:', err));
            });
        }
    </script>
</body>
</html>
